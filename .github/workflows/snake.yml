name: Generate Snake Game

on:
  schedule:
    # Tự động chạy mỗi 12 tiếng một lần
    - cron: "0 */12 * * *"
  # Cho phép bấm chạy thủ công trên giao diện GitHub Actions
  workflow_dispatch:
  # Tự động chạy lại mỗi khi bạn push code lên nhánh main
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Generate GitHub Contribution Snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#00F5D4&color_dots=#161b22,#0e4429,#006d32,#26a641,#00f5d4

      - name: Push Snake SVG to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
